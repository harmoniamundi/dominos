<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tempus fugit</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tempus fugit">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<link rel="stylesheet" href="app/style.css">
</head>
<body>

<div class="metronome-wrapper" id="metronomeWrapper">
  <svg class="body-svg" viewBox="0 0 350 590">
    <defs>
      <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e1f25"/>
        <stop offset="60%" stop-color="#0c0d10"/>
        <stop offset="100%" stop-color="#040405"/>
      </linearGradient>
      <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="25%" stop-color="#777777"/>
        <stop offset="50%" stop-color="#222222"/>
        <stop offset="100%" stop-color="#cccccc"/>
      </linearGradient>
    </defs>
    <path d="M 115,14 C 150,6 200,6 235,14 C 258,19 270,32 277,52 L 335,498 C 345,532 328,565 292,576 C 230,587 120,587 58,576 C 22,565 5,532 15,498 L 73,52 C 80,32 92,19 115,14 Z" 
          fill="url(#bodyGrad)" stroke="url(#silverBorder)" stroke-width="3" stroke-linejoin="round"/>
  </svg>

  <div class="metronome-content">
    <div class="scale-ladder" id="scaleLadder"></div>

    <div class="pendulum-pivot" id="pendulum">
      <div class="rod" id="rodEl"></div>
      <div class="rod-base" id="rodBaseEl"></div>
      <div class="weight" id="weight">
        <div class="weight-top-bar"></div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="hub-circle" id="hubBtn">
        <span class="bpm-val" id="bpmDisplay">80</span>
        <span class="bpm-unit">bpm</span>
      </div>

      <div class="display-row">
        <div class="param-box clickable" id="batBtn">
          <span class="param-num" id="batDisplay">4</span>
          <span class="param-lbl">bat</span>
        </div>
      </div>

      <div class="tempo-name" id="tempoText">Andante</div>

      <div class="btn-row">
        <button class="touch-btn" id="slowerBtn">
          <svg class="arrow-icon" viewBox="0 0 24 10">
            <path d="M 2,8 Q 12,1 22,8" />
          </svg>
          <span class="lbl">+lent</span>
        </button>
        <button class="touch-btn" id="fasterBtn">
          <svg class="arrow-icon" viewBox="0 0 24 10">
            <path d="M 2,2 Q 12,9 22,2" />
          </svg>
          <span class="lbl">+rapide</span>
        </button>
      </div>

      <div class="popover-menu" id="beatMenu"></div>
    </div>
  </div>
</div>

<script>
  const wrapperEl = document.getElementById('metronomeWrapper');

  function resizeMetronome() {
    const baseWidth = 460;
    const baseHeight = 590;
    const margin = 16;
    
    const availableWidth = window.innerWidth - margin;
    const availableHeight = window.innerHeight - margin;

    const scaleX = availableWidth / baseWidth;
    const scaleY = availableHeight / baseHeight;
    const scale = Math.min(scaleX, scaleY);

    wrapperEl.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', resizeMetronome);
  window.addEventListener('orientationchange', resizeMetronome);

  const MIN_BPM = 20;
  const MAX_BPM = 240;

  const MIN_Y = -380;
  const MAX_Y = -60;

  let bpm = 80;
  let targetBpm = 80;
  let activeBpm = 80;
  let visualBpm = 80;
  let beatsPerMeasure = 4;
  let accentedBeats = new Set();
  let currentBeat = 0;
  let isRunning = false;
  let isStopping = false;
  let stopStartTime = 0;
  let stopPhase = 0;
  let stopOmega = 0;
  let stopMaxAngle = 0;
  let stopGamma = 0;
  let stopDuration = 0;

  let audioCtx = null;
  let nextNoteTime = 0.0;
  let timerID = null;
  let animFrameReq = null;
  let holdAnimFrame = null;
  let audioStartTime = 0;
  let pendulumPhase = 0;
  let lastFrameAudioTime = 0;

  let isTransitioningBpm = false;
  let bpmTransitionAnim = null;

  const pendulum = document.getElementById('pendulum');
  const weight = document.getElementById('weight');
  const rodEl = document.getElementById('rodEl');
  const rodBaseEl = document.getElementById('rodBaseEl');
  const bpmDisplay = document.getElementById('bpmDisplay');
  const tempoText = document.getElementById('tempoText');
  const scaleLadder = document.getElementById('scaleLadder');
  const hubBtn = document.getElementById('hubBtn');
  const slowerBtn = document.getElementById('slowerBtn');
  const fasterBtn = document.getElementById('fasterBtn');

  const batBtn = document.getElementById('batBtn');
  const batDisplay = document.getElementById('batDisplay');
  const beatMenu = document.getElementById('beatMenu');

  const bpmStepsTopToBottom = [20, 30, 40, 50, 60, 72, 80, 96, 112, 126, 144, 160, 184, 208, 240];
  const steps = [20, 30, 40, 50, 60, 72, 80, 96, 112, 126, 144, 160, 184, 208, 240];

  function buildScale() {
    scaleLadder.innerHTML = '';
    const totalSteps = 28;
    for (let i = 0; i <= totalSteps; i++) {
      const stepEl = document.createElement('div');
      stepEl.className = 'scale-step';
      const isMajor = i % 2 === 0;
      const tick = document.createElement('div');
      tick.className = `tick-line ${isMajor ? 'major' : ''}`;
      stepEl.appendChild(tick);

      if (isMajor) {
        const idx = i / 2;
        if (idx < bpmStepsTopToBottom.length) {
          const num = document.createElement('div');
          num.className = 'scale-number';
          num.textContent = bpmStepsTopToBottom[idx];
          stepEl.appendChild(num);
        }
      }
      scaleLadder.appendChild(stepEl);
    }
  }
  buildScale();

  function buildBeatMenu() {
    beatMenu.innerHTML = '';

    const valueDisplay = document.createElement('div');
    valueDisplay.className = 'beat-value';
    valueDisplay.textContent = beatsPerMeasure;
    beatMenu.appendChild(valueDisplay);

    const labelsRow = document.createElement('div');
    labelsRow.className = 'beat-slider-labels';
    for (let i = 1; i <= 12; i++) {
      const lbl = document.createElement('span');
      lbl.textContent = i;
      labelsRow.appendChild(lbl);
    }
    beatMenu.appendChild(labelsRow);

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '1';
    slider.max = '12';
    slider.step = '1';
    slider.value = beatsPerMeasure;
    slider.className = 'beat-slider';
    slider.addEventListener('click', (e) => e.stopPropagation());
    slider.addEventListener('input', (e) => {
      e.stopPropagation();
      beatsPerMeasure = parseInt(slider.value, 10);
      batDisplay.textContent = beatsPerMeasure;
      valueDisplay.textContent = beatsPerMeasure;
      currentBeat = 0;
      for (const b of Array.from(accentedBeats)) {
        if (b >= beatsPerMeasure) accentedBeats.delete(b);
      }
      buildNotesRow();
    });
    beatMenu.appendChild(slider);

    const notesRow = document.createElement('div');
    notesRow.className = 'beat-notes-row';
    notesRow.id = 'beatNotesRow';
    beatMenu.appendChild(notesRow);

    buildNotesRow();
  }

  function buildNotesRow() {
    const notesRow = document.getElementById('beatNotesRow');
    if (!notesRow) return;
    notesRow.innerHTML = '';
    for (let i = 0; i < beatsPerMeasure; i++) {
      const isAccented = accentedBeats.has(i);
      const noteBtn = document.createElement('div');
      noteBtn.className = `note-icon ${isAccented ? 'accented' : ''}`;
      noteBtn.innerHTML = `
        <svg viewBox="0 0 20 40" class="note-svg">
          <line x1="14" y1="2" x2="14" y2="26" class="note-stem" />
          <ellipse cx="8" cy="30" rx="7" ry="5" class="note-head" transform="rotate(-15 8 30)"/>
        </svg>`;
      noteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (accentedBeats.has(i)) {
          accentedBeats.delete(i);
        } else {
          accentedBeats.add(i);
        }
        buildNotesRow();
      });
      notesRow.appendChild(noteBtn);
    }
  }
  buildBeatMenu();

  batBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    beatMenu.classList.toggle('open');
  });

  window.addEventListener('click', () => {
    beatMenu.classList.remove('open');
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      beatMenu.classList.remove('open');
    }
  });

  const tempoCategories = [
    { name: 'Larghissimo', max: 30, targetBpm: 20 },
    { name: 'Grave', max: 45, targetBpm: 35 },
    { name: 'Largo', max: 60, targetBpm: 50 },
    { name: 'Larghetto', max: 66, targetBpm: 63 },
    { name: 'Adagio', max: 76, targetBpm: 70 },
    { name: 'Andante', max: 108, targetBpm: 90 },
    { name: 'Moderato', max: 120, targetBpm: 114 },
    { name: 'Allegro', max: 156, targetBpm: 135 },
    { name: 'Vivace', max: 176, targetBpm: 166 },
    { name: 'Presto', max: 200, targetBpm: 188 },
    { name: 'Prestissimo', max: 241, targetBpm: 220 }
  ];

  function getTempoName(val) {
    if (val < 30) return 'Larghissimo';
    if (val < 45) return 'Grave';
    if (val < 60) return 'Largo';
    if (val < 66) return 'Larghetto';
    if (val < 76) return 'Adagio';
    if (val < 108) return 'Andante';
    if (val < 120) return 'Moderato';
    if (val < 156) return 'Allegro';
    if (val < 176) return 'Vivace';
    if (val < 200) return 'Presto';
    return 'Prestissimo';
  }

  function handleTempoTierChange(direction = 'next') {
    if (isStopping) return;
    
    let currentCatIdx = 0;
    for (let i = 0; i < tempoCategories.length; i++) {
      if (targetBpm < tempoCategories[i].max) {
        currentCatIdx = i;
        break;
      }
    }
    
    let nextCatIdx = currentCatIdx;

    if (direction === 'prev') {
      if (currentCatIdx > 0) {
        nextCatIdx = currentCatIdx - 1;
      }
    } else {
      if (currentCatIdx < tempoCategories.length - 1) {
        nextCatIdx = currentCatIdx + 1;
      }
    }

    if (nextCatIdx === currentCatIdx) {
      stopTierHold();
      return;
    }

    const newTarget = tempoCategories[nextCatIdx].targetBpm;
    smoothTransitionToBpm(newTarget, false);
  }

  function handleTempoTextClick(e) {
    if (isStopping) return;
    e.stopPropagation();
    handleTempoTierChange(e.shiftKey ? 'prev' : 'next');
  }

  tempoText.addEventListener('click', handleTempoTextClick);

  function smoothTransitionToBpm(targetVal, isFastReset) {
    if (isStopping) return;
    if (isTransitioningBpm && bpmTransitionAnim) {
      cancelAnimationFrame(bpmTransitionAnim);
    }

    isTransitioningBpm = true;
    const startBpm = targetBpm;
    const startTimeAnim = performance.now();
    const duration = isFastReset ? 150 : 350;

    function animateBpmStep(now) {
      if (isStopping) {
        isTransitioningBpm = false;
        return;
      }
      const elapsed = now - startTimeAnim;
      const progress = Math.min(1, elapsed / duration);
      const easeProgress = 1 - Math.pow(1 - progress, 3);
      
      const currentVal = startBpm + (targetVal - startBpm) * easeProgress;
      setTargetBpmDirect(currentVal);

      if (progress < 1) {
        bpmTransitionAnim = requestAnimationFrame(animateBpmStep);
      } else {
        setTargetBpmDirect(targetVal);
        isTransitioningBpm = false;
      }
    }

    bpmTransitionAnim = requestAnimationFrame(animateBpmStep);
  }

  function bpmToY(val) {
    const clamped = Math.max(MIN_BPM, Math.min(MAX_BPM, val));
    for (let i = 0; i < steps.length - 1; i++) {
      if (clamped >= steps[i] && clamped <= steps[i + 1]) {
        const ratio = (clamped - steps[i]) / (steps[i + 1] - steps[i]);
        const y1 = MIN_Y + (i * (MAX_Y - MIN_Y) / (steps.length - 1));
        const y2 = MIN_Y + ((i + 1) * (MAX_Y - MIN_Y) / (steps.length - 1));
        return y1 + ratio * (y2 - y1);
      }
    }
    return MIN_Y;
  }

  function yToBpm(y) {
    const clampedY = Math.max(MIN_Y, Math.min(MAX_Y, y));
    const indexFrac = ((clampedY - MIN_Y) / (MAX_Y - MIN_Y)) * (steps.length - 1);
    const i = Math.min(Math.floor(indexFrac), steps.length - 2);
    const ratio = indexFrac - i;
    return steps[i] + ratio * (steps[i + 1] - steps[i]);
  }

  function updateUI(displayVal) {
    const rounded = Math.round(displayVal);
    bpmDisplay.textContent = rounded;
    tempoText.textContent = getTempoName(rounded);
    weight.style.top = `${bpmToY(displayVal)}px`;
  }

  function setTargetBpmDirect(newBpm) {
    if (isStopping) return;
    targetBpm = Math.max(MIN_BPM, Math.min(MAX_BPM, newBpm));
    bpm = Math.round(targetBpm);
    activeBpm = targetBpm;
    visualBpm = targetBpm;
    updateUI(visualBpm);
  }

  function updateTargetAndUI(newBpm) {
    targetBpm = Math.max(MIN_BPM, Math.min(MAX_BPM, newBpm));
    bpm = Math.round(targetBpm);
    activeBpm = targetBpm;
    visualBpm = targetBpm;
    updateUI(visualBpm);
  }

  let isDraggingWeight = false;

  function handleWeightStart(e) {
    if (isRunning || isStopping) return;
    if (isTransitioningBpm) {
      isTransitioningBpm = false;
      if (bpmTransitionAnim) cancelAnimationFrame(bpmTransitionAnim);
    }
    isDraggingWeight = true;
    e.stopPropagation();
  }

  function handleWeightMove(e) {
    if (!isDraggingWeight || isRunning || isStopping) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const pivotRect = pendulum.getBoundingClientRect();
    
    const wrapperRect = wrapperEl.getBoundingClientRect();
    const currentScale = wrapperRect.height / 590;
    
    const relativeY = (clientY - pivotRect.top) / currentScale;
    const newBpm = yToBpm(relativeY);
    targetBpm = Math.max(MIN_BPM, Math.min(MAX_BPM, newBpm));
    bpm = Math.round(targetBpm);
    activeBpm = targetBpm;
    visualBpm = targetBpm;
    updateUI(visualBpm);
  }

  function handleWeightEnd() {
    isDraggingWeight = false;
  }

  weight.addEventListener('mousedown', handleWeightStart);
  window.addEventListener('mousemove', handleWeightMove);
  window.addEventListener('mouseup', handleWeightEnd);

  weight.addEventListener('touchstart', handleWeightStart, { passive: true });
  window.addEventListener('touchmove', handleWeightMove, { passive: true });
  window.addEventListener('touchend', handleWeightEnd);

  const toggleClick = (e) => {
    e.stopPropagation();
    toggleMetronome();
  };
  rodEl.addEventListener('click', toggleClick);
  rodBaseEl.addEventListener('click', toggleClick);

  let holdTimer = null;
  let isHoldingActive = false;

  function startHold(delta) {
    if (isStopping) return;
    if (isTransitioningBpm) {
      isTransitioningBpm = false;
      if (bpmTransitionAnim) cancelAnimationFrame(bpmTransitionAnim);
    }

    updateTargetAndUI(targetBpm + delta);
    if (targetBpm <= MIN_BPM || targetBpm >= MAX_BPM) return;
    
    isHoldingActive = true;

    if (holdTimer) clearTimeout(holdTimer);
    if (holdAnimFrame) cancelAnimationFrame(holdAnimFrame);

    holdTimer = setTimeout(() => {
      if (!isHoldingActive) return;
      const holdStartTimeLoop = performance.now();

      function accelerateLoop(timestamp) {
        if (!isHoldingActive) return;
        const elapsed = (timestamp - holdStartTimeLoop) / 1000;
        const speed = Math.min(220, 6 * Math.exp(2.8 * elapsed));
        const dt = 0.016;

        let nextVal = targetBpm + delta * speed * dt;
        updateTargetAndUI(nextVal);

        if (targetBpm <= MIN_BPM || targetBpm >= MAX_BPM) {
          stopHold();
          return;
        }

        holdAnimFrame = requestAnimationFrame(accelerateLoop);
      }
      holdAnimFrame = requestAnimationFrame(accelerateLoop);
    }, 250);
  }

  function stopHold() {
    isHoldingActive = false;
    if (holdTimer) {
      clearTimeout(holdTimer);
      holdTimer = null;
    }
    if (holdAnimFrame) {
      cancelAnimationFrame(holdAnimFrame);
      holdAnimFrame = null;
    }
  }

  let tierHoldTimer = null;
  let tierAnimFrame = null;
  let isTierHoldingActive = false;

  function startTierHold(direction) {
    if (isStopping) return;
    if (isTransitioningBpm) {
      isTransitioningBpm = false;
      if (bpmTransitionAnim) cancelAnimationFrame(bpmTransitionAnim);
    }

    let currentCatIdx = 0;
    for (let i = 0; i < tempoCategories.length; i++) {
      if (targetBpm < tempoCategories[i].max) {
        currentCatIdx = i;
        break;
      }
    }
    if ((direction === 'prev' && currentCatIdx === 0) || (direction === 'next' && currentCatIdx === tempoCategories.length - 1)) {
      return;
    }

    handleTempoTierChange(direction);
    isTierHoldingActive = true;

    if (tierHoldTimer) clearTimeout(tierHoldTimer);
    if (tierAnimFrame) cancelAnimationFrame(tierAnimFrame);

    tierHoldTimer = setTimeout(() => {
      if (!isTierHoldingActive) return;
      const startTime = performance.now();
      let lastStepTime = startTime;

      function tierLoop(timestamp) {
        if (!isTierHoldingActive) return;
        const elapsedTotal = (timestamp - startTime) / 1000;
        const currentInterval = Math.max(20, 140 * Math.exp(-3.2 * elapsedTotal));

        if (timestamp - lastStepTime >= currentInterval) {
          handleTempoTierChange(direction);
          lastStepTime = timestamp;
        }

        tierAnimFrame = requestAnimationFrame(tierLoop);
      }
      tierAnimFrame = requestAnimationFrame(tierLoop);
    }, 100);
  }

  function stopTierHold() {
    isTierHoldingActive = false;
    if (tierHoldTimer) {
      clearTimeout(tierHoldTimer);
      tierHoldTimer = null;
    }
    if (tierAnimFrame) {
      cancelAnimationFrame(tierAnimFrame);
      tierAnimFrame = null;
    }
  }

  function bindHoldButton(btn, delta) {
    const start = (e) => {
      e.preventDefault();
      startHold(delta);
    };
    const stop = () => {
      stopHold();
    };

    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);

    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', stop);
    btn.addEventListener('touchcancel', stop);
  }

  bindHoldButton(slowerBtn, -1);
  bindHoldButton(fasterBtn, 1);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      if (document.activeElement.tagName === 'INPUT') return;
      e.preventDefault();
      if (!e.repeat) toggleMetronome();
    } else if (e.code === 'ArrowUp' || e.key === 'ArrowUp') {
      if (isStopping) return;
      if (document.activeElement.tagName === 'INPUT') return;
      e.preventDefault();
      if (e.repeat) return;
      startHold(-1);
    } else if (e.code === 'ArrowDown' || e.key === 'ArrowDown') {
      if (isStopping) return;
      if (document.activeElement.tagName === 'INPUT') return;
      e.preventDefault();
      if (e.repeat) return;
      startHold(1);
    } else if (e.code === 'ArrowRight' || e.key === 'ArrowRight') {
      if (isStopping) return;
      if (document.activeElement.tagName === 'INPUT') return;
      e.preventDefault();
      if (e.repeat) return;
      startTierHold('next');
    } else if (e.code === 'ArrowLeft' || e.key === 'ArrowLeft') {
      if (isStopping) return;
      if (document.activeElement.tagName === 'INPUT') return;
      e.preventDefault();
      if (e.repeat) return;
      startTierHold('prev');
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowUp' || e.key === 'ArrowUp' || e.code === 'ArrowDown' || e.key === 'ArrowDown') {
      stopHold();
    } else if (e.code === 'ArrowRight' || e.key === 'ArrowRight' || e.code === 'ArrowLeft' || e.key === 'ArrowLeft') {
      stopTierHold();
    }
  });

  function playSound(time, isAccent) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (isAccent) {
      // Son de type "wood block" aigu et fort : pas de descente de pitch
      // (contrairement à un clic), timbre fixe et percussif, décroissance très rapide.
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(2600, time);
      osc.frequency.exponentialRampToValueAtTime(2200, time + 0.01);

      gain.gain.setValueAtTime(9.0, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.014);

      // Couche additionnelle plus grave pour donner le "corps" du bloc de bois
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();

      subOsc.type = 'square';
      subOsc.frequency.setValueAtTime(1100, time);

      subGain.gain.setValueAtTime(5.0, time);
      subGain.gain.exponentialRampToValueAtTime(0.001, time + 0.01);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);

      subOsc.start(time);
      subOsc.stop(time + 0.01);
    } else {
      osc.type = 'square';
      osc.frequency.setValueAtTime(2400, time);
      osc.frequency.exponentialRampToValueAtTime(140, time + 0.018);

      gain.gain.setValueAtTime(6.4, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.018);
    }

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(time);
    osc.stop(time + 0.018);
  }

  // Horloge dans un Web Worker : les timers d'un onglet en arrière-plan sont
  // fortement bridés (1 s, voire 1 min) dans le thread principal, pas dans un worker.
  let tickWorker = null;
  function getTickWorker() {
    if (!tickWorker) {
      const src = "let id=null;onmessage=e=>{if(e.data==='start'){if(id===null)id=setInterval(()=>postMessage('tick'),25);}else if(e.data==='stop'){clearInterval(id);id=null;}};";
      tickWorker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      tickWorker.onmessage = () => scheduler();
    }
    return tickWorker;
  }

  function scheduler() {
    if (!isRunning) return;
    // Si le thread a été gelé, on se recale au lieu de rejouer un paquet de clics en retard
    if (nextNoteTime < audioCtx.currentTime - 0.05) {
      nextNoteTime = audioCtx.currentTime + 0.05;
    }
    while (nextNoteTime < audioCtx.currentTime + 0.25) {
      const isAccent = accentedBeats.has(currentBeat);
      playSound(nextNoteTime, isAccent);
      currentBeat = (currentBeat + 1) % beatsPerMeasure;
      nextNoteTime += 60.0 / bpm;
    }
  }

  function animate() {
    if (isRunning) {
      const now = audioCtx.currentTime;
      const dt = now - lastFrameAudioTime;
      lastFrameAudioTime = now;

      const omega = Math.PI * (bpm / 60);
      pendulumPhase += omega * dt;

      const maxAngle = 10 + (240 - bpm) * (14 / 220);
      const currentAngle = Math.sin(pendulumPhase) * maxAngle;

      pendulum.style.transform = `rotate(${currentAngle}deg)`;

      animFrameReq = requestAnimationFrame(animate);
    } else if (isStopping) {
      const tau = (performance.now() - stopStartTime) / 1000;
      const progress = Math.min(1, tau / stopDuration);

      const envelope = Math.exp(-stopGamma * tau * tau);
      const currentAngle = stopMaxAngle * envelope * Math.sin(stopPhase + stopOmega * tau);

      pendulum.style.transform = `rotate(${currentAngle}deg)`;

      if (progress < 1) {
        animFrameReq = requestAnimationFrame(animate);
      } else {
        isStopping = false;
        pendulum.style.transform = `rotate(0deg)`;
        weight.classList.remove('disabled');
        slowerBtn.disabled = false;
        fasterBtn.disabled = false;
      }
    } else {
      pendulum.style.transform = `rotate(0deg)`;
    }
  }

  function toggleMetronome() {
    if ('audioSession' in navigator) {
      try {
        navigator.audioSession.type = 'playback';
      } catch (e) {
        console.error("Échec de la configuration AudioSession:", e);
      }
    }

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // macOS/Safari/Chrome peuvent suspendre le contexte audio : on le relance
      audioCtx.onstatechange = () => {
        if (isRunning && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
      };
    }

    if (isRunning || isStopping) {
      if (isRunning) {
        getTickWorker().postMessage('stop');
        stopHold();
        stopTierHold();
        if (isTransitioningBpm) {
          isTransitioningBpm = false;
          if (bpmTransitionAnim) cancelAnimationFrame(bpmTransitionAnim);
        }
        const maxAngle = 10 + (240 - bpm) * (14 / 220);
        const omega = Math.PI * (bpm / 60);

        stopPhase = pendulumPhase;
        stopOmega = omega;
        stopMaxAngle = maxAngle;
        stopStartTime = performance.now();

        stopDuration = Math.min(0.4, (60.0 / bpm) * 0.5);
        stopGamma = 4.60517 / (stopDuration * stopDuration);

        isRunning = false;
        isStopping = true;
        slowerBtn.disabled = false;
        fasterBtn.disabled = false;
      } else {
        isStopping = false;
        if (animFrameReq) cancelAnimationFrame(animFrameReq);
        pendulum.style.transform = `rotate(0deg)`;
        weight.classList.remove('disabled');
        slowerBtn.disabled = false;
        fasterBtn.disabled = false;
      }
      hubBtn.style.borderColor = '#555660';
    } else {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isStopping = false;
      isRunning = true;
      weight.classList.add('disabled');
      currentBeat = 0;
      activeBpm = targetBpm;
      bpm = Math.round(targetBpm);
      
      audioStartTime = audioCtx.currentTime;
      nextNoteTime = audioStartTime + (30 / bpm);
      pendulumPhase = 0;
      lastFrameAudioTime = audioStartTime;
      
      scheduler();
      getTickWorker().postMessage('start');
      animFrameReq = requestAnimationFrame(animate);
      hubBtn.style.borderColor = '#ffffff';
    }
    syncMediaSession();
  }

  // --- Touches médias (⏯ / F8 sur un clavier de MacBook) ---------------------
  // Le navigateur n'associe les touches médias à une page que si elle joue un
  // vrai élément <audio> (Web Audio seul ne suffit pas). On fait donc tourner en
  // boucle un son de garde pendant que le métronome joue, et on branche les
  // actions de l'API Media Session sur toggleMetronome().
  // Firefox ignore les médias « inaudibles » ou de moins de 3 s : le son de garde
  // dure donc 5 s et contient un souffle à -66 dBFS, au-dessus de son seuil
  // d'audibilité (-72 dBFS) mais imperceptible à l'oreille.
  // À noter : il faut avoir interagi une fois avec la page (clic, Espace) après
  // son chargement ; ensuite ⏯ lance et arrête le métronome même hors de l'onglet.
  let keepAliveAudio = null;

  function makeKeepAliveWavUrl() {
    const rate = 8000, secs = 5, n = rate * secs; // 16 bits mono
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    // sinus 100 Hz, amplitude 16/32768 (≈ -66 dBFS) ; 500 périodes exactes → boucle sans clic
    for (let i = 0; i < n; i++) {
      v.setInt16(44 + i * 2, Math.round(16 * Math.sin(2 * Math.PI * 100 * i / rate)), true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  function syncMediaSession() {
    if (!('mediaSession' in navigator)) return;
    if (!keepAliveAudio) {
      keepAliveAudio = new Audio(makeKeepAliveWavUrl());
      keepAliveAudio.loop = true;
    }
    if (isRunning) {
      keepAliveAudio.play().catch(() => {});
      navigator.mediaSession.playbackState = 'playing';
    } else {
      keepAliveAudio.pause();
      navigator.mediaSession.playbackState = 'paused';
    }
  }

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Tempus fugit',
        artist: 'Métronome',
        artwork: [{ src: 'app/icon-512.png', sizes: '512x512', type: 'image/png' }]
      });
    } catch (e) {}
    const handlers = {
      play: () => {
        if (isStopping) toggleMetronome();   // termine l'arrêt en cours
        if (!isRunning) toggleMetronome();
      },
      pause: () => { if (isRunning) toggleMetronome(); },
      stop:  () => { if (isRunning) toggleMetronome(); }
    };
    for (const [action, fn] of Object.entries(handlers)) {
      try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {}
    }
  }
  setupMediaSession();

  hubBtn.addEventListener('click', toggleMetronome);

  document.addEventListener('visibilitychange', () => {
    if (isRunning && audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  });

  resizeMetronome();
  updateUI(targetBpm);

  // Fonctionnement hors ligne : le service worker (sw.js, à la racine) met
  // l'appli en cache. Il exige https ou localhost (pas file://).
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
